# Credentials committed to source.
#
# lory-scan:ignore-file[secrets.*] -- this file *is* the secret ruleset. The
# values in `examples:` below are invented, and exist so `rules validate` can
# prove each rule still fires; scanning them would report the scanner to
# itself on every run.
#
# These rules match on shape, not on entropy — a string that is unmistakably an
# AWS key or a GitHub token is a finding whether or not it looks random. The
# entropy detector in the engine covers the rest.
#
# Every one of these is `critical` or `high` for the same reason: the fix is
# never just deleting the line. The credential is in the repository's history,
# which means it is on every clone, and it has to be rotated.

defaults:
  category: secrets
  languages: [any]
  owasp: "A07:2021 Identification and Authentication Failures"
  cwe: 798
  ignore_case: false
  remediation: >
    Rotate this credential now — deleting the line does not help, because the
    value is still in the git history and on every clone and CI cache. Then
    load it at runtime from the environment or a secret manager, and add the
    file to .gitignore if it was never meant to be committed.
  references:
    - https://cwe.mitre.org/data/definitions/798.html

rules:
  - id: secrets.aws-access-key-id
    title: AWS access key ID committed to source
    severity: critical
    confidence: high
    pattern: '\b(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}\b'
    prefilters: [akia, asia, abia, acca, a3t]
    description: >
      An AWS access key ID is present in source. Paired with its secret it
      grants API access as that IAM principal, and key IDs are usually
      committed alongside the secret.
    tags: [aws, cloud]
    examples:
      - 'AKIA{u:16}'
      - 'ASIA{u:16}'
    counterexamples:
      - 'AKIA123'
      - 'not_a_key_at_all'

  - id: secrets.aws-secret-access-key
    title: AWS secret access key committed to source
    severity: critical
    confidence: medium
    pattern: '(?i)aws.{0,20}?(?:secret|private).{0,20}?["''`]([A-Za-z0-9/+=]{40})["''`]'
    prefilters: [aws]
    description: >
      A 40-character base64 value assigned to an AWS-secret-shaped name. This
      is the half of an AWS credential pair that actually signs requests.
    tags: [aws, cloud]
    examples:
      - 'aws_secret_access_key = "{a:40}"'

  - id: secrets.github-token
    title: GitHub token committed to source
    severity: critical
    confidence: high
    pattern: '\b(?:ghp|gho|ghu|ghs|ghr|github_pat)_[A-Za-z0-9_]{20,}\b'
    prefilters: [ghp_, gho_, ghu_, ghs_, ghr_, github_pat]
    description: >
      A GitHub personal access, OAuth, or app token. Depending on its scopes
      it can read private repositories, push code, and act on CI.
    tags: [github, vcs]
    examples:
      - 'ghp_{a:36}'
      - 'github_pat_{a:22}'
    counterexamples:
      - 'ghp_short'

  - id: secrets.gitlab-token
    title: GitLab token committed to source
    severity: critical
    confidence: high
    pattern: '\bglpat-[A-Za-z0-9_\-]{20,}\b'
    prefilters: [glpat-]
    description: A GitLab personal access token, which acts as that user.
    tags: [gitlab, vcs]
    examples:
      - 'glpat-{a:20}'

  - id: secrets.slack-token
    title: Slack token committed to source
    severity: high
    confidence: high
    pattern: '\bxox[abposr]-[A-Za-z0-9\-]{10,}\b'
    prefilters: [xox]
    description: >
      A Slack API token. Bot and user tokens can read channel history and post
      as the workspace identity they belong to.
    tags: [slack, saas]
    examples:
      - 'xoxb-{d:12}-{d:13}-{a:24}'
    counterexamples:
      - 'xoxo-nope'

  - id: secrets.slack-webhook
    title: Slack incoming webhook URL committed to source
    severity: medium
    confidence: high
    pattern: 'https://hooks\.slack\.com/services/T[A-Za-z0-9_/]{20,}'
    description: >
      A Slack webhook URL is a bearer credential: anyone holding it can post
      into that channel.
    tags: [slack, saas]

  - id: secrets.stripe-secret-key
    title: Stripe secret key committed to source
    severity: critical
    confidence: high
    pattern: '\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}\b'
    prefilters: [sk_live, sk_test, rk_live, rk_test]
    description: >
      A Stripe secret key. A live key can move money and read customer data;
      a test key still exposes test-mode data and is usually a sign the live
      one is handled the same way.
    tags: [stripe, payments]
    examples:
      - 'sk_live_{a:24}'
      - 'rk_test_{a:24}'
    counterexamples:
      - 'pk_live_{a:24}'

  - id: secrets.google-api-key
    title: Google API key committed to source
    severity: high
    confidence: high
    pattern: '\bAIza[A-Za-z0-9_\-]{35}\b'
    prefilters: [aiza]
    description: >
      A Google API key. Unless it is restricted by referrer or IP it can be
      used by anyone who finds it, billed to your project.
    tags: [google, cloud]
    examples:
      - 'AIza{a:35}'

  - id: secrets.google-service-account
    title: Google service account private key in source
    severity: critical
    confidence: high
    pattern: '"type"\s*:\s*"service_account"'
    requires: 'private_key'
    description: >
      A Google service account JSON key file. These carry a private key and
      typically hold broad project permissions.
    tags: [google, cloud]
    examples:
      - '"type": "service_account", "private_key": "x"'

  - id: secrets.private-key-block
    title: Private key committed to source
    severity: critical
    confidence: high
    pattern: '-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'
    description: >
      A PEM private key block. Whatever it authenticates — TLS, SSH, signing,
      JWT issuance — is compromised for as long as the key is valid.
    tags: [pki, key]
    remediation: >
      Treat the key as compromised: issue a new keypair, deploy it, and revoke
      this one. Private keys should be generated on the host that uses them
      and never travel through a repository.
    examples:
      - '-----BEGIN RSA PRIVATE KEY-----'
      - '-----BEGIN OPENSSH PRIVATE KEY-----'
    counterexamples:
      - '-----BEGIN CERTIFICATE-----'

  - id: secrets.jwt-hardcoded
    title: JSON Web Token committed to source
    severity: high
    confidence: medium
    pattern: '\beyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b'
    prefilters: ['eyj']
    description: >
      A signed JWT. If it is a live session or service token it is usable
      until it expires; if it is an example, it still often carries a real
      signing-key-derived signature.
    tags: [jwt, token]
    examples:
      - 'eyJ{a:16}.eyJ{a:16}.{a:32}'

  - id: secrets.twilio-key
    title: Twilio credential committed to source
    severity: high
    confidence: high
    patterns:
      - '\btwilio\w*\s*[=:]\s*["'']?(?:SK|AC)[0-9a-fA-F]{32}\b'
      - '["''](?:SK|AC)[0-9a-fA-F]{32}["'']'
    prefilters: [twilio, '"sk', "'sk", '"ac', "'ac"]
    description: >
      A Twilio account SID or API key. Twilio credentials can send messages
      and place calls at your expense.
    tags: [twilio, saas]
    examples:
      - 'twilio_sid = "AC{h:32}"'

  - id: secrets.sendgrid-key
    title: SendGrid API key committed to source
    severity: high
    confidence: high
    pattern: '\bSG\.[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}\b'
    prefilters: ['sg.']
    description: A SendGrid API key, which can send mail as your domain.
    tags: [sendgrid, saas]
    examples:
      - 'SG.{a:22}.{a:24}'

  - id: secrets.npm-token
    title: npm token committed to source
    severity: high
    confidence: high
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'
    prefilters: [npm_]
    description: >
      An npm access token. With publish rights it can push a new version of
      your package to every consumer.
    tags: [npm, supply-chain]
    examples:
      - 'npm_{a:36}'

  - id: secrets.openai-key
    title: OpenAI or Anthropic API key committed to source
    severity: high
    confidence: high
    patterns:
      - '\bsk-[A-Za-z0-9]{20,}\b'
      - '\bsk-ant-[A-Za-z0-9_\-]{20,}\b'
    prefilters: [sk-]
    not_patterns:
      - 'sk-(?:xxx|placeholder|example|your)'
    description: >
      A model provider API key. These are billed per call and are a common
      target for scrapers watching public commits.
    tags: [ai, saas]
    examples:
      - 'sk-{a:28}'
      - 'sk-ant-api03-{a:24}'
    counterexamples:
      - 'sk-xxxxxxxxxxxxxxxxxxxxxxxx'

  - id: secrets.database-url-with-password
    title: Database connection string with an inline password
    severity: high
    confidence: medium
    pattern: '\b(?:postgres|postgresql|mysql|mongodb(?:\+srv)?|redis|amqp|mssql)://[^\s:@/"'']+:[^\s:@/"'']{4,}@'
    prefilters: ['postgres://', 'postgresql://', 'mysql://', 'mongodb://', 'mongodb+srv://', 'redis://', 'amqp://', 'mssql://']
    not_patterns:
      - '://[^\s]*:(?:password|passwd|pass|secret|changeme|example|user|test|root)@'
      - '\$\{|\{\{|process\.env|os\.environ|getenv'
    description: >
      A connection URI with credentials inline. These end up in logs, error
      pages, and process listings as well as in the repository.
    cwe: 798
    tags: [database, credential]
    remediation: >
      Rotate the database password, then build the URI at runtime from
      environment variables or a secret manager. Check your logging too — an
      inline-credential URI is usually logged verbatim on connection failure.
    examples:
      - 'postgres://appuser:{a:16}@db.internal:5432/prod'
    counterexamples:
      - 'postgres://appuser:${DB_PASSWORD}@db:5432/prod'
      - 'postgres://user:password@localhost/db'

  - id: secrets.basic-auth-in-url
    title: HTTP Basic credentials embedded in a URL
    severity: high
    confidence: medium
    pattern: 'https?://[A-Za-z0-9._%\-]+:[^\s:@/"'']{4,}@[A-Za-z0-9.\-]+'
    prefilters: ['http']
    not_patterns:
      - '\$\{|\{\{|process\.env|os\.environ|getenv|example\.com|localhost'
    description: >
      Credentials in a URL are sent in the Referer header, stored in browser
      history and proxy logs, and shown in full in most error traces.
    cwe: 522
    tags: [credential, url]
    examples:
      - 'https://admin:{a:12}@internal.corp.net/api'
    counterexamples:
      - 'https://api.example.com/v1'

  - id: secrets.htpasswd-hash
    title: Password hash committed to source
    severity: medium
    confidence: medium
    pattern: '\$(?:2[aby]|apr1|1|5|6)\$[A-Za-z0-9./$]{10,}'
    prefilters: ['$2a$', '$2b$', '$2y$', '$apr1$', '$1$', '$5$', '$6$']
    description: >
      A crypt-format password hash. Committed hashes are offline-crackable at
      leisure, and are usually for accounts that still exist.
    cwe: 522
    tags: [credential, hash]
    remediation: >
      Move the hash out of the repository and reset the account's password.
      Even a strong hash gives an attacker unlimited offline guesses.
    examples:
      - '$2y$10${a:22}'
      - '$2a$12${a:22}'

  - id: secrets.env-file-committed
    title: Environment file with assigned secrets is in the repository
    severity: high
    confidence: medium
    languages: [env]
    paths: ["**/.env*"]
    exclude_paths: ["**/.env.example", "**/.env.sample", "**/.env.template", "**/.env.dist"]
    pattern: '(?im)^\s*(?:export\s+)?[A-Z0-9_]*(?:SECRET|PASSWORD|TOKEN|APIKEY|API_KEY|PRIVATE_KEY|ACCESS_KEY)[A-Z0-9_]*\s*=\s*\S{8,}'
    not_patterns:
      - '=\s*["'']?\$\{|=\s*["'']?<|changeme|example|placeholder|your[_-]'
    description: >
      A .env file holding real-looking values is committed. These files are
      meant to stay on the machine that uses them; committing one publishes
      every credential in it.
    tags: [env, credential]
    remediation: >
      Rotate everything in the file, add it to .gitignore, and commit a
      .env.example with empty or obviously fake values instead. Removing the
      file in a later commit does not remove it from history.
